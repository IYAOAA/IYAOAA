<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IYAOAA Blog</title>

  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; }

    /* Posts grid */
    #posts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 10px;
    }

    .post-card {
      border: 1px solid #ddd;
      border-radius: 5px;
      overflow: hidden;
      background: #fff;
    }

    .post-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .post-card h3 {
      padding: 10px;
      font-size: 18px;
      margin: 0;
    }

    .post-card p {
      padding: 0 10px 10px;
      font-size: 14px;
      color: #555;
    }

    /* Pagination */
    #pagination {
      text-align: center;
      margin: 20px;
      font-size: 18px;
    }

    #pagination a {
      margin: 0 5px;
      cursor: pointer;
      text-decoration: none;
      color: blue;
    }

    /* Mobile layout: 2 columns */
    @media (max-width: 768px) {
      #posts { grid-template-columns: repeat(2, 1fr); }
      .post-card img { height: 140px; }
    }

    @media (max-width: 480px) {
      #posts { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

  <h1 style="text-align:center; padding:20px;">Latest Posts</h1>

  <!-- POSTS CONTAINER -->
  <div id="posts"></div>

  <!-- PAGINATION -->
  <div id="pagination"></div>

  <!-- SINGLE SCRIPT HANDLING EVERYTHING -->
  <script>
    let allPosts = [];

    async function loadPosts() {
      try {
        const res = await fetch("posts.json");
        allPosts = await res.json();

        setupPagination();
      } catch (err) {
        console.error("Error loading posts:", err);
      }
    }

    function setupPagination() {
      const postsPerPage = 8;
      const urlParams = new URLSearchParams(window.location.search);
      let currentPage = parseInt(urlParams.get("page")) || 1;

      const totalPages = Math.ceil(allPosts.length / postsPerPage);
      if (currentPage > totalPages) currentPage = totalPages;

      const start = (currentPage - 1) * postsPerPage;
      const end = start + postsPerPage;

      renderPosts(allPosts.slice(start, end));
      renderPagination(currentPage, totalPages);
    }

    function renderPosts(posts) {
      const container = document.getElementById("posts");
      container.innerHTML = posts
        .map(
          (post) => `
        <div class="post-card">
          <a href="${post.content}">
            <img src="${post.image}" alt="${post.title}">
          </a>
          <h3><a href="${post.content}">${post.title}</a></h3>
          <p>${post.summary}</p>
        </div>
      `
        )
        .join("");
    }

    function renderPagination(current, totalPages) {
      let html = "";

      if (current > 1) {
        html += `<a href="?page=${current - 1}">← Prev</a>`;
      }

      for (let i = 1; i <= totalPages; i++) {
        html += i === current
          ? `<strong>[${i}]</strong>`
          : `<a href="?page=${i}">${i}</a>`;
      }

      if (current < totalPages) {
        html += `<a href="?page=${current + 1}">Next →</a>`;
      }

      document.getElementById("pagination").innerHTML = html || "";
    }

    loadPosts();
  </script>
</body>
</html>
