<section id="latest-posts">
  <h2>Latest Posts</h2>
  <div id="posts-container" class="post-grid"></div>
  <div id="pagination"></div>
</section>

<script>
let allPosts = [];
const postsPerPage = 8;

fetch('data/posts.json')
.then(res => res.json())
.then(posts => {
  allPosts = posts;
  loadPage();
})
.catch(err => console.error('Error loading posts:', err));

function loadPage(page = 1) {
  const start = (page - 1) * postsPerPage;
  const end = start + postsPerPage;
  const visible = allPosts.slice(start, end);

  document.getElementById('posts-container').innerHTML = visible.map(post => `
      <article class="post">
        <img src="${post.image}" alt="${post.title}" class="post-image">
        <h2 class="post-title">
          <a href="post.html?id=${post.id}">${post.title}</a>
        </h2>
        <p class="post-meta">Posted on ${new Date(post.date).toDateString()} • by Ibrahim</p>
        <p class="post-excerpt">${post.summary}</p>
        <div class="post-tags">
          ${post.categories.map(cat => `<a href="#">${cat}</a>`).join(' ')}
        </div>
        <a href="post.html?id=${post.id}" class="read-more">Read more →</a>
      </article>
  `).join('');

  renderPagination(page);
}

function renderPagination(activePage) {
  const totalPages = Math.ceil(allPosts.length / postsPerPage);
  const pagination = document.getElementById("pagination");

  let html = "";
  for (let i = 1; i <= totalPages; i++) {
    html += `<a href="#" onclick="loadPage(${i})" class="${i === activePage ? 'active' : ''}">${i}</a>`;
  }
  pagination.innerHTML = html;
}
</script>
