<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IYAOAA | Latest Posts</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <!-- Header -->
    <header>
        <h1>IYAOAA Blog</h1>
    </header>

    <!-- Main Layout -->
    <div class="container" style="display:flex; gap:20px;">

        <!-- ==== MAIN BLOG POSTS ==== -->
        <main style="flex:3;">
            <div id="post-list"></div>
            <div id="pagination" style="margin-top:20px;"></div>
        </main>

        <!-- ==== SIDEBAR ==== -->
        <aside style="flex:1;">
            <input type="text" id="searchInput" placeholder="Search..." style="width:100%;margin-bottom:15px;padding:10px;">

            <h3>Recent Posts</h3>
            <ul id="recentPosts"></ul>

            <h3>Popular Posts</h3>
            <ul id="popularPosts"></ul>

            <h3>Categories</h3>
            <ul id="categoryList"></ul>
        </aside>
    </div>

    <!-- Footer -->
    <footer style="margin-top:50px;text-align:center;">
        <p>© 2025 IYAOAA Blog</p>
    </footer>



    <!-- ===================== JAVASCRIPT ===================== -->
    <script>
        const POSTS_PER_PAGE = 8;
        let allPosts = [];
        let filteredPosts = [];
        let currentPage = new URLSearchParams(window.location.search).get("page") || 1;

        async function loadPosts() {
            try {
                const response = await fetch("data/posts.json");
                allPosts = await response.json();
                filteredPosts = [...allPosts];

                displayPosts();
                loadSidebar();
                loadCategories();
            } catch (err) {
                console.error("JSON ERROR:", err);
            }
        }

        function displayPosts() {
            const postContainer = document.getElementById("post-list");
            postContainer.innerHTML = "";

            const start = (currentPage - 1) * POSTS_PER_PAGE;
            const selectedPosts = filteredPosts.slice(start, start + POSTS_PER_PAGE);

            selectedPosts.forEach(post => {
                postContainer.innerHTML += `
                <div class="post-card">
                    <img src="${post.image}" alt="${post.title}" style="width:100%; border-radius:10px;">
                    <h2>${post.title}</h2>
                    <p>${post.summary}</p>
                    <a href="${post.content}" class="read-more">Read More</a>
                </div>`;
            });

            renderPagination();
        }

        function renderPagination() {
            const pagination = document.getElementById("pagination");
            pagination.innerHTML = "";

            const totalPages = Math.ceil(filteredPosts.length / POSTS_PER_PAGE);

            let buttons = "";

            if (currentPage > 1) {
                buttons += `<a href="?page=${Number(currentPage) - 1}" class="page-btn">Prev</a>`;
            }

            for (let i = 1; i <= totalPages; i++) {
                buttons += `<a href="?page=${i}" class="page-btn ${i == currentPage ? "active" : ""}">${i}</a>`;
            }

            if (currentPage < totalPages) {
                buttons += `<a href="?page=${Number(currentPage) + 1}" class="page-btn">Next</a>`;
            }

            pagination.innerHTML = buttons;
        }


        /* --- SEARCH FUNCTION --- */
        document.getElementById("searchInput").addEventListener("input", function () {
            const searchValue = this.value.toLowerCase();
            filteredPosts = allPosts.filter(post =>
                post.title.toLowerCase().includes(searchValue)
            );
            currentPage = 1;
            displayPosts();
        });


        /* --- SIDEBAR: RECENT & POPULAR POSTS --- */
        function loadSidebar() {
            const recent = document.getElementById("recentPosts");
            const popular = document.getElementById("popularPosts");

            const recentPosts = allPosts.slice(0, 5);
            const popularPosts = allPosts.slice().reverse().slice(0, 5);

            recent.innerHTML = recentPosts.map(p => `<li><a href="${p.content}">${p.title}</a></li>`).join("");
            popular.innerHTML = popularPosts.map(p => `<li><a href="${p.content}">${p.title}</a></li>`).join("");
        }


        /* --- CATEGORY FILTERING --- */
        function loadCategories() {
            let categories = [...new Set(allPosts.flatMap(p => p.categories))];

            const catList = document.getElementById("categoryList");
            catList.innerHTML = `<li><a href="#" onclick="filterCategory('All')">All</a></li>`;

            categories.forEach(cat => {
                catList.innerHTML += `<li><a href="#" onclick="filterCategory('${cat}')">${cat}</a></li>`;
            });
        }

        function filterCategory(category) {
            if (category === "All") {
                filteredPosts = [...allPosts];
            } else {
                filteredPosts = allPosts.filter(post => post.categories.includes(category));
            }
            currentPage = 1;
            displayPosts();
        }

        loadPosts();
    </script>

</body>
</html>
